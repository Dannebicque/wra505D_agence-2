name: CI-Packages

on:
  push:
    branches: [develop]
    paths:
      - 'uniservices/packages/**'
      - 'uniservices/shared/**'
      - 'uniservices/package.json'
      - 'uniservices/pnpm-lock.yaml'
      - 'uniservices/pnpm-workspace.yaml'
      - '.github/workflows/CI-front.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'uniservices/packages/**'
      - 'uniservices/shared/**'
      - 'uniservices/package.json'
      - 'uniservices/pnpm-lock.yaml'
      - 'uniservices/pnpm-workspace.yaml'
      - '.github/workflows/CI-front.yml'

permissions:
  contents: read

concurrency:
  group: ci-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-packages:
    name: Vue / packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniservices

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: uniservices/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality checks
        run: make check-front
