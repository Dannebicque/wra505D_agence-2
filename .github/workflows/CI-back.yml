name: CI-Back

on:
  push:
    branches: [develop]
    paths:
      - 'uniservices/back/**'
      - 'uniservices/packages/**'
      - '.github/workflows/CI-back.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'uniservices/back/**'
      - 'uniservices/packages/**'
      - '.github/workflows/CI-back.yml'

permissions:
  contents: read

concurrency:
  group: ci-back-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-back:
    name: Symfony / PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniservices/back

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # L'historique complet permet de trouver les fichiers modifiés par la PR.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, iconv, simplexml
          coverage: none
          tools: composer:v2

      - name: Run backend quality checks
        run: make check

      - name: Check PSR-12 style of the changed PHP files
        if: github.event_name == 'pull_request'
        run: BASE=origin/${{ github.base_ref }} bin/cs-diff
