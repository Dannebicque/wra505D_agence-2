controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Contrôleurs déplacés dans le bundle stage par le client (convention en PDF, soutenances).
stage_controllers:
    resource:
        path: '../../packages/stage-bundle/src/Controller/'
        namespace: StageBundle\Controller
    type: attribute

# API des plans de cours, ajoutée par le client dans le bundle intranet.
intranet_controllers:
    resource:
        path: '../../packages/intranet-bundle/src/Controller/'
        namespace: IntranetBundle\Controller
    type: attribute
